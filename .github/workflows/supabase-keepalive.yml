name: Supabase Keepalive

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://oodlpererkbxhiuugbax.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Iy7vBnXW9i9wb-TkEBSuFw_mA-k0JSr
    steps:
      - name: Query one public product
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/products?select=id&active=eq.true&limit=1"
